<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102c45"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="IT English"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><title>Global IT English Coach</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;color:#183249;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer}.shell{max-width:560px;margin:auto;min-height:100dvh;background:#f7f9fc;padding-bottom:90px}.top{background:#102c45;color:white;padding:calc(18px + env(safe-area-inset-top)) 20px 24px}.eyebrow{font-size:11px;letter-spacing:1.7px;color:#a8cadb}.top h1{font-size:23px;margin:7px 0 4px}.top p{color:#c4d7e4;margin:0;font-size:13px}.content{padding:16px}.card{background:#fff;border:1px solid #e1e8ef;border-radius:17px;padding:17px;margin-bottom:14px;box-shadow:0 2px 12px #173b5910}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.muted{color:#60768a;font-size:13px}.pill{background:#e8f3f6;color:#11617a;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:700}.pill.bcp{background:#f0eefe;color:#6250a1}h2{font-size:18px;margin:0 0 13px}h3{font-size:15px;margin:12px 0 7px}.metric{font-size:29px;font-weight:750}.progress{height:9px;border-radius:20px;background:#e5edf2;overflow:hidden;margin:10px 0}.progress>div{height:100%;background:#2088a2;transition:width .2s}.primary,.secondary,.danger{width:100%;padding:12px;border-radius:11px;border:0;margin-top:9px;font-weight:700}.primary{background:#146a89;color:white}.secondary{background:#eaf1f5;color:#184b63}.danger{background:#fff0ee;color:#a43e31}.mini{padding:7px 10px;border:1px solid #d7e4ec;border-radius:9px;background:#fff;color:#155c7b}.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(560px,100%);display:grid;grid-template-columns:repeat(5,1fr);background:white;border-top:1px solid #dce5ec;padding:9px 4px calc(8px + env(safe-area-inset-bottom));z-index:10}.tab{border:0;background:transparent;color:#708396;font-size:10px;padding:4px 0}.tab span{display:block;font-size:21px;margin-bottom:2px}.tab.active{color:#086a8a;font-weight:750}.lesson{border:1px solid #e1e9ef;border-radius:12px;padding:13px;margin:9px 0}.lesson p{margin:6px 0;font-size:13px}.lesson .en{font-size:15px;color:#102c45;font-weight:650;line-height:1.5}.hidden{display:none!important}.choice{display:block;width:100%;text-align:left;padding:11px;margin:7px 0;border:1px solid #d8e4ed;background:white;border-radius:10px}.choice.correct{background:#e2f5e9;border-color:#4ca974}.choice.wrong{background:#ffefeb;border-color:#d98b78}textarea,input,select{width:100%;border:1px solid #cfdee8;background:white;border-radius:10px;padding:12px;margin:6px 0 11px;color:#17364c}textarea{min-height:110px;resize:vertical}label{font-size:13px;font-weight:650}.notice{font-size:12px;background:#fff8e9;border:1px solid #f1dfae;padding:11px;border-radius:10px;color:#775a20;line-height:1.6}.kpi{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.kpi>div{background:#f1f6f9;border-radius:11px;padding:13px}.kpi strong{display:block;font-size:23px}.listline{padding:11px 0;border-bottom:1px solid #e7edf2}.listline:last-child{border:0}.subtle{font-size:12px;color:#6b8191}.speak{width:auto;margin-left:7px}.footer{font-size:11px;text-align:center;color:#8294a2;padding:12px}button:disabled{opacity:.5;cursor:default}
</style></head><body><div class="shell"><header class="top"><div class="eyebrow">GLOBAL IT ENGLISH COACH</div><h1 id="pageTitle">今日の学習</h1><p>ITGC 70% · IT-BCP 30% · 6か月プログラム</p></header><main class="content" id="main"></main><nav class="tabs" id="tabs" aria-label="メインメニュー"></nav></div><script>
'use strict';
const KEY='giec-v1'; const TODAY=()=>new Date().toLocaleDateString('sv-SE');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const topics=[
['ITGC','Access Management','アクセス管理','We review user access rights on a regular basis.','ユーザーのアクセス権限を定期的に見直します。','access rights','アクセス権限','How often do you review privileged accounts?','特権アカウントをどのくらいの頻度で見直していますか？'],
['ITGC','Change Management','変更管理','All production changes require prior approval.','本番環境の変更には事前承認が必要です。','prior approval','事前承認','Could you show us the approval evidence?','承認の証跡を提示いただけますか？'],
['ITGC','IT Operations','IT運用管理','We monitor batch jobs and investigate failures.','バッチジョブを監視し、失敗を調査します。','investigate failures','障害を調査する','Who is responsible for reviewing the job logs?','ジョブログの確認責任者は誰ですか？'],
['ITGC','Segregation of Duties','職務分掌','Developers should not approve their own production changes.','開発担当者が自身の本番変更を承認すべきではありません。','segregation of duties','職務分掌','How do you prevent conflicts of interest?','利益相反をどのように防止していますか？'],
['ITGC','Audit Evidence','監査証跡','Please retain evidence of the control execution.','統制の実施証跡を保管してください。','retain evidence','証跡を保管する','Can you provide the records for the last quarter?','前四半期の記録をご提供いただけますか？'],
['ITGC','Control Effectiveness','統制の有効性','We need to evaluate whether the control operated effectively.','統制が有効に運用されたかを評価する必要があります。','operated effectively','有効に運用された','What evidence supports your conclusion?','その結論を裏付ける証跡は何ですか？'],
['ITGC','Remediation Plan','改善計画','Please define the corrective actions and target dates.','是正措置と目標日を明確にしてください。','corrective actions','是正措置','What is the root cause of this issue?','この問題の根本原因は何ですか？'],
['ITBCP','Business Impact Analysis','事業影響度分析','The business impact analysis identifies critical processes.','事業影響度分析では重要業務を特定します。','critical processes','重要業務','Which systems support your critical processes?','重要業務を支えるシステムはどれですか？'],
['ITBCP','Recovery Objectives','復旧目標','The recovery time objective defines the target recovery duration.','RTOは目標復旧時間を定義します。','recovery time objective','目標復旧時間（RTO）','Have you agreed on the RTO and RPO?','RTOとRPOについて合意していますか？'],
['ITBCP','Disaster Recovery Exercise','災害復旧訓練','We conduct recovery exercises and document lessons learned.','復旧訓練を実施し、教訓を文書化します。','lessons learned','得られた教訓','What improvements were identified during the exercise?','訓練でどのような改善点が見つかりましたか？']
];
const modules=topics.map((t,i)=>({id:i,kind:t[0],title:t[1],ja:t[2],en:t[3],meaning:t[4],term:t[5],termJa:t[6],question:t[7],questionJa:t[8]}));
function fresh(){return {version:1,started:TODAY(),minutes:{},done:{},quiz:{},reviews:{},conversations:[],custom:[],settings:{daily:15,mode:'commute'},lastOpen:TODAY()}};
let state;try{state=JSON.parse(localStorage.getItem(KEY))||fresh();if(state.version!==1||!state.minutes||!state.done)throw Error('invalid')}catch{state=fresh()}
let tab='home',activeLesson=null,quizAnswer=null,quizFinished=false;const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){alert('保存できませんでした。空き容量を確認し、バックアップを作成してください。')}};
const minsToday=()=>state.minutes[TODAY()]||0;const countDone=()=>Object.keys(state.done).length;const progress=(n,d)=>`<div class="progress"><div style="width:${Math.min(100,Math.round(n/d*100))}%"></div></div>`;
const allModules=()=>[...modules,...(state.custom||[])];
const nextLesson=()=>allModules().find(x=>!state.done[x.id])||modules[0];
function track(m){state.minutes[TODAY()]=(state.minutes[TODAY()]||0)+m;save();render()}
let currentUtterance=null;
function audioStatus(message){
  let el=document.getElementById('audioStatus');
  if(!el){el=document.createElement('div');el.id='audioStatus';el.setAttribute('role','status');el.style.cssText='position:fixed;bottom:85px;left:12px;right:12px;max-width:536px;margin:auto;background:#102c45;color:#fff;padding:10px 14px;border-radius:10px;font-size:13px;z-index:999;box-shadow:0 2px 12px #0003';document.body.appendChild(el)}
  el.textContent=message;
}
function speak(s){
  if(!window.speechSynthesis||!window.SpeechSynthesisUtterance){audioStatus('この環境では音声読み上げを利用できません。Safariで公開URLを開いてお試しください。');return}
  const synth=window.speechSynthesis;
  try{
    synth.cancel();
    const u=new SpeechSynthesisUtterance(s);
    currentUtterance=u; // iOS Safari: keep a strong reference until speech ends
    u.lang='en-US';u.rate=0.85;u.pitch=1;u.volume=1;
    const voices=synth.getVoices();
    const voice=voices.find(v=>v.lang.toLowerCase()==='en-us'&&v.localService)||voices.find(v=>v.lang.toLowerCase()==='en-us')||voices.find(v=>v.lang.toLowerCase().startsWith('en'));
    if(voice)u.voice=voice;
    u.onstart=()=>audioStatus('🔊 読み上げ中…');
    u.onend=()=>{currentUtterance=null;audioStatus('✓ 読み上げが完了しました')};
    u.onerror=e=>{currentUtterance=null;audioStatus('音声を再生できませんでした（'+e.error+'）。iPhoneの音量・音声設定をご確認ください。')};
    audioStatus('🔊 音声を準備しています…');
    synth.speak(u); // must be invoked synchronously inside the tap handler
    if(synth.paused)synth.resume();
  }catch(e){audioStatus('音声エラー: '+e.message)}
}
const titles={home:'今日の学習',learn:'教材',practice:'AI英会話',review:'復習',stats:'学習分析'};
function navigate(t){tab=t;activeLesson=null;quizAnswer=null;quizFinished=false;render();window.scrollTo(0,0)}
function render(){document.getElementById('pageTitle').textContent=titles[tab];document.getElementById('tabs').innerHTML=[['home','⌂','ホーム'],['learn','▤','教材'],['practice','◉','会話'],['review','↻','復習'],['stats','▥','分析']].map(([id,ic,name])=>`<button class="tab ${tab===id?'active':''}" data-tab="${id}"><span>${ic}</span>${name}</button>`).join('');document.getElementById('main').innerHTML=({home:home,learn:learn,practice:practice,review:review,stats:stats})[tab]();}
function home(){const m=nextLesson(),total=Object.values(state.minutes).reduce((a,b)=>a+b,0);return `<section class="card"><div class="row"><div><div class="muted">今日の学習</div><div class="metric">${minsToday()} <small style="font-size:15px">/ ${state.settings.daily} 分</small></div></div><span class="pill">Day ${Math.min(180,Math.floor((Date.now()-new Date(state.started).getTime())/86400000)+1)} / 180</span></div>${progress(minsToday(),state.settings.daily)}<div class="muted">累計 ${total} 分 · 完了教材 ${countDone()} / ${allModules().length}</div></section><section class="card"><h2>本日のおすすめ</h2><div class="lesson"><span class="pill ${m.kind==='ITBCP'?'bcp':''}">${m.kind==='ITBCP'?'IT-BCP':'ITGC'}</span><h3>${esc(m.title)}</h3><p>${esc(m.ja)}</p><p class="en">${esc(m.en)}</p></div><button class="primary" data-action="open" data-id="${m.id}">教材を学習する</button><button class="secondary" data-tab="practice">AI英会話を練習する</button></section><section class="card"><h2>今日の学習メニュー</h2><div class="listline">① 専門用語・例文 <span class="muted">5分</span></div><div class="listline">② AI会話 <span class="muted">7分</span></div><div class="listline">③ 復習 <span class="muted">3分</span></div><button class="secondary" data-action="track" data-min="5">自主学習5分を記録</button></section><div class="notice">アプリは個人学習用です。会社の機密情報・監査資料・個人情報をAIに入力しないでください。</div>`}
function learn(){if(activeLesson!==null){const m=allModules().find(x=>String(x.id)===String(activeLesson));if(!m)return '<p>教材が見つかりません。</p>';return `<button class="mini" data-action="back">← 教材一覧</button><section class="card" style="margin-top:12px"><span class="pill ${m.kind==='ITBCP'?'bcp':''}">${m.kind==='ITBCP'?'IT-BCP':'ITGC'}</span><h2 style="margin-top:12px">${esc(m.title)}</h2><div class="muted">${esc(m.ja)}</div><h3>重要表現</h3><p class="en">${esc(m.term)} <button class="mini speak" data-action="speak" data-text="${encodeURIComponent(m.term)}">▶ 発音</button></p><p>${esc(m.termJa)}</p><h3>説明する</h3><p class="en">${esc(m.en)} <button class="mini speak" data-action="speak" data-text="${encodeURIComponent(m.en)}">▶</button></p><p class="muted">${esc(m.meaning)}</p><h3>質問する</h3><p class="en">${esc(m.question)} <button class="mini speak" data-action="speak" data-text="${encodeURIComponent(m.question)}">▶</button></p><p class="muted">${esc(m.questionJa)}</p><h3>確認問題</h3><p>「${esc(m.term)}」の意味は？</p>${[m.termJa,'変更を実施する','定例会議を開く','資料を共有する'].map((a,i)=>`<button class="choice ${quizAnswer!==null?(i===0?'correct':quizAnswer===i?'wrong':''):''}" data-action="answer" data-answer="${i}" ${quizAnswer!==null?'disabled':''}>${i+1}. ${esc(a)}</button>`).join('')}${quizAnswer!==null?`<p class="muted">${quizAnswer===0?'正解です！':'正解：'+esc(m.termJa)} 次回の復習にも活用しましょう。</p><button class="primary" data-action="complete" data-id="${m.id}">学習を完了（5分）</button>`:''}</section>`}return `<section class="card"><h2>学習教材</h2><p class="muted">ITGC 7テーマ・IT-BCP 3テーマ。まずは基礎を広く学び、各テーマを繰り返し練習します。</p><div class="row"><span class="pill">ITGC 70%</span><span class="pill bcp">IT-BCP 30%</span></div>${allModules().map(m=>`<div class="lesson"><div class="row"><span class="pill ${m.kind==='ITBCP'?'bcp':''}">${m.kind==='ITBCP'?'IT-BCP':'ITGC'}</span><span class="muted">${state.done[m.id]?'✓ 学習済':'未学習'}</span></div><h3>${esc(m.title)}</h3><p>${esc(m.ja)}</p><button class="mini" data-action="open" data-id="${m.id}">教材を開く →</button></div>`).join('')}</section><section class="card"><h2>教材を追加</h2><p class="muted">AIで作った教材などを手動で登録できます。登録内容はこの端末に保存されます。</p><label>分野</label><select id="customKind"><option value="ITGC">ITGC</option><option value="ITBCP">IT-BCP</option></select><label>英語テーマ名</label><input id="customTitle" placeholder="e.g. Risk Assessment"><label>日本語テーマ名</label><input id="customJa" placeholder="例：リスク評価"><label>英語例文</label><textarea id="customEn" placeholder="We assess risks on a regular basis."></textarea><label>日本語訳</label><textarea id="customMeaning" placeholder="私たちは定期的にリスクを評価します。"></textarea><button class="primary" data-action="addcustom">教材を追加する</button></section>`}
const scenarios=[['Explain a Control','統制の説明','You are an IT governance manager. Explain the purpose, scope, owner, frequency, and evidence of an IT general control to an overseas IT representative.'],['Check Implementation','実施状況の確認','Ask an overseas IT representative how access reviews are performed, who approves them, and what evidence is retained.'],['Discuss Findings','監査指摘の協議','Discuss an audit finding involving missing change approvals. Ask about the root cause and agree on corrective actions and due dates.'],['IT-BCP Exercise','IT-BCP訓練','Discuss a disaster recovery exercise with an overseas IT team. Ask about RTO, RPO, results, and lessons learned.']];
let scenarioIndex=0;
function promptText(){const s=scenarios[scenarioIndex];return `You are my English speaking coach and role-play partner. My level is beginner-intermediate. I work in IT governance and want to communicate with overseas IT representatives about ITGC and IT-BCP. Scenario: ${s[2]} Use clear international English. Start with a short question and wait for my response. Gradually increase difficulty. Correct only serious communication errors during the conversation; save minor grammar and phrasing corrections until the end. If I struggle, provide short Japanese explanations. At the end, provide: (1) English conversation transcript, (2) key corrections with Japanese explanations, (3) 5 useful expressions, and (4) feedback scores from 1 to 5 for clarity, vocabulary, response, and practical communication. Do not ask for confidential company information. Begin the role-play now.`}
function practice(){return `<section class="card"><h2>実務英会話ロールプレイ</h2><p class="muted">場面を選び、課題をコピーしてChatGPTの音声会話で練習します。</p><label>練習場面</label><select id="scenario">${scenarios.map((s,i)=>`<option value="${i}" ${scenarioIndex===i?'selected':''}>${esc(s[1])} / ${esc(s[0])}</option>`).join('')}</select><div class="lesson"><b>${esc(scenarios[scenarioIndex][1])}</b><p>${esc(scenarios[scenarioIndex][2])}</p></div><button class="primary" data-action="copyPrompt">英会話課題をコピー</button><button class="secondary" data-action="openChatGPT">ChatGPTを開く ↗</button><p class="subtle">ChatGPTで音声モードを開始し、コピーした課題を送信してください。音声利用の制限はChatGPTの契約・利用状況によります。</p></section><section class="card"><h2>会話・添削結果を保存</h2><label>練習日</label><input id="practiceDate" type="date" value="${TODAY()}"><label>会話テキスト</label><textarea id="transcript" placeholder="英語での会話内容を貼り付け"></textarea><label>添削・改善ポイント</label><textarea id="feedback" placeholder="ChatGPTからの添削、自然な言い換え、重要表現を貼り付け"></textarea><button class="primary" data-action="savePractice">記録を保存（7分）</button></section><section class="card"><h2>練習履歴</h2>${state.conversations.length?state.conversations.slice().reverse().map((c,i)=>`<div class="listline"><b>${esc(c.date)} · ${esc(c.scenario)}</b><p class="muted" style="white-space:pre-wrap">${esc(c.transcript).slice(0,180)}</p><details><summary>全文・添削を見る</summary><h3>会話</h3><p style="white-space:pre-wrap">${esc(c.transcript)}</p><h3>添削</h3><p style="white-space:pre-wrap">${esc(c.feedback)}</p></details></div>`).join(''):'<p class="muted">まだ記録はありません。</p>'}</section>`}
function review(){const pool=allModules().filter(x=>state.done[x.id]);return `<section class="card"><h2>復習カード</h2><p class="muted">学習済みの単語を繰り返し確認します。発音ボタンは端末の読み上げ機能を利用します。</p>${pool.length?pool.map(m=>`<div class="lesson"><span class="pill ${m.kind==='ITBCP'?'bcp':''}">${m.kind==='ITBCP'?'IT-BCP':'ITGC'}</span><p class="en">${esc(m.term)} <button class="mini" data-action="speak" data-text="${encodeURIComponent(m.term)}">▶</button></p><details><summary>意味を見る</summary><p>${esc(m.termJa)}</p><p class="muted">${esc(m.en)}</p></details><div class="row" style="margin-top:9px"><button class="mini" data-action="rate" data-id="${m.id}" data-rating="again">もう一度</button><button class="mini" data-action="rate" data-id="${m.id}" data-rating="good">覚えた</button><span class="subtle">${state.reviews[m.id]==='good'?'✓ 習得':'復習中'}</span></div></div>`).join(''):'<p class="muted">まず教材を1つ完了すると、復習カードが表示されます。</p>'}<button class="secondary" data-action="track" data-min="3">復習3分を記録</button></section>`}
function stats(){const total=Object.values(state.minutes).reduce((a,b)=>a+b,0),learned=allModules().filter(x=>state.done[x.id]).length,mastered=Object.values(state.reviews).filter(x=>x==='good').length;const days=Object.entries(state.minutes).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,7);return `<section class="card"><h2>学習ダッシュボード</h2><div class="kpi"><div><span class="muted">累計学習時間</span><strong>${total}分</strong></div><div><span class="muted">教材の完了</span><strong>${learned} / ${allModules().length}</strong></div><div><span class="muted">習得単語</span><strong>${mastered}</strong></div><div><span class="muted">会話練習</span><strong>${state.conversations.length}回</strong></div></div><h3>教材進捗</h3>${progress(learned,allModules().length)}<h3>最近の学習</h3>${days.length?days.map(([d,v])=>`<div class="row listline"><span>${esc(d)}</span><b>${v}分</b></div>`).join(''):'<p class="muted">学習記録はまだありません。</p>'}</section><section class="card"><h2>設定</h2><label>1日の目標学習時間</label><select id="daily"><option value="10" ${state.settings.daily===10?'selected':''}>10分</option><option value="15" ${state.settings.daily===15?'selected':''}>15分</option><option value="20" ${state.settings.daily===20?'selected':''}>20分</option></select><label>学習環境</label><select id="mode"><option value="commute" ${state.settings.mode==='commute'?'selected':''}>通勤中（静かに学習）</option><option value="home" ${state.settings.mode==='home'?'selected':''}>自宅（発話練習）</option></select><button class="secondary" data-action="saveSettings">設定を保存</button></section><section class="card"><h2>バックアップ・復元</h2><p class="muted">Safariのデータ消去・端末変更に備え、週1回程度のバックアップをおすすめします。</p><button class="primary" data-action="export">学習データを書き出す（JSON）</button><label style="display:block;margin-top:15px">バックアップファイルを読み込む</label><input type="file" id="importFile" accept=".json,application/json"><button class="secondary" data-action="import">ファイルから復元</button><button class="danger" data-action="reset">すべての学習データを消去</button></section><div class="notice">個人データはこのブラウザ内に保存されます。バックアップには会話テキストが含まれるため、安全な場所に保管してください。プライベートブラウズは避けてください。</div>`}
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.tab){navigate(b.dataset.tab);return}const a=b.dataset.action;if(a==='open'){tab='learn';activeLesson=b.dataset.id;quizAnswer=null;render();window.scrollTo(0,0)}else if(a==='back'){activeLesson=null;render()}else if(a==='speak')speak(decodeURIComponent(b.dataset.text));else if(a==='answer'){quizAnswer=Number(b.dataset.answer);render()}else if(a==='complete'){state.done[b.dataset.id]=TODAY();state.quiz[b.dataset.id]=quizAnswer===0;state.minutes[TODAY()]=(state.minutes[TODAY()]||0)+5;save();activeLesson=null;quizAnswer=null;render()}else if(a==='track'){track(Number(b.dataset.min));alert('学習時間を記録しました')}else if(a==='rate'){state.reviews[b.dataset.id]=b.dataset.rating;save();render()}else if(a==='addcustom'){const title=document.getElementById('customTitle').value.trim(),ja=document.getElementById('customJa').value.trim(),en=document.getElementById('customEn').value.trim(),meaning=document.getElementById('customMeaning').value.trim();if(!title||!ja||!en||!meaning){alert('すべて入力してください');return}const kind=document.getElementById('customKind').value;state.custom.push({id:'custom-'+Date.now(),kind,title,ja,en,meaning,term:title,termJa:ja,question:'Could you explain this control?',questionJa:'この統制について説明いただけますか？'});save();render();alert('教材を追加しました')}else if(a==='copyPrompt'){try{await navigator.clipboard.writeText(promptText());alert('課題をコピーしました。ChatGPTで貼り付けてください。')}catch{const t=document.createElement('textarea');t.value=promptText();document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();alert('課題をコピーしました')}}else if(a==='openChatGPT'){window.open('https://chatgpt.com/','_blank','noopener,noreferrer')}else if(a==='savePractice'){const date=document.getElementById('practiceDate').value,transcript=document.getElementById('transcript').value.trim(),feedback=document.getElementById('feedback').value.trim();if(!transcript&&!feedback){alert('会話または添削結果を入力してください');return}state.conversations.push({date,scenario:scenarios[scenarioIndex][1],transcript,feedback});state.minutes[TODAY()]=(state.minutes[TODAY()]||0)+7;save();render();alert('練習記録を保存しました')}else if(a==='saveSettings'){state.settings.daily=Number(document.getElementById('daily').value);state.settings.mode=document.getElementById('mode').value;save();render();alert('設定を保存しました')}else if(a==='export'){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='it-english-backup-'+TODAY()+'.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}else if(a==='import'){const f=document.getElementById('importFile').files[0];if(!f){alert('ファイルを選んでください');return}try{if(f.size>2e6)throw Error('ファイルが大きすぎます');const data=JSON.parse(await f.text());if(data.version!==1||!data.minutes||!data.done||!Array.isArray(data.conversations)||!Array.isArray(data.custom))throw Error('形式が違います');if(confirm('現在の学習データをバックアップの内容で置き換えますか？')){state=data;save();render();alert('復元しました')}}catch(err){alert('読み込めません: '+err.message)}}else if(a==='reset'){if(confirm('すべての学習履歴を削除します。元に戻せません。続けますか？')){state=fresh();save();render()}}});
document.addEventListener('change',e=>{if(e.target.id==='scenario'){scenarioIndex=Number(e.target.value);render()}});
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
save();render();
</script></body></html>
